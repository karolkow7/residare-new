<style>
  #sidebar {
    position: fixed;
    top: 0;
    left: -290px;
    width: 250px;
    height: 100%;
    background: #ffffff;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    padding: 5rem 1rem 1rem;
    transition: left 0.3s ease-in-out;
    z-index: 1000;
  }
  #sidebar.open {
    left: 0;
  }
  #sidebar a {
    display: block;
    margin-bottom: 1rem;
    color: #1f2937;
    text-decoration: none;
    font-weight: 500;
  }
  .hamburger {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 1100;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
  }

  #main-logo {
    width: 100%;
    max-width: 400px;
    height: auto;
  }

  @media (max-width: 768px) {
    #main-logo {
      max-width: 240px;
    }
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 1rem;
  }

  .topbar .logo {
    height: 160px !important;
    width: auto !important;
    margin-left: 1rem;
  }

  .topbar select {
    height: 2.5rem;
    font-size: 1rem;
    margin-left: auto;
  }

  .header-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
  }

  .logo-container {
    position: absolute;
    top: -80px;
    left: 25%;
    transform: translateX(-50%);
    height: 240px;
  }

  .header-logo {
    height: 240px;
    width: auto;
  }

  i.fa-heart {
    color: crimson;
  }

  i.fa-circle-plus {
    color: teal;
  }

  i.fa-user {
    color: darkslateblue;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    display: none;
    z-index: 998;
  }

  .sidebar.open ~ #overlay {
    display: block;
  }
</style>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>

</div>
<div style="position: absolute; top: 1rem; right: 8rem; display: flex; gap: 1rem; font-size: 0.9rem;">
<a data-i18n="nav.favorites" href="favoriten.html" style="font-family: inherit; color: #000; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; border: 1px solid black; border-radius: 8px; padding: 0.4rem 0.8rem;"><i class="fa-regular fa-heart"></i> Favoriten</a>

<main style="max-width: 800px; margin: 4rem auto; padding: 0 1rem;">
<h1 data-i18n="admin.title">Inserat erstellen</h1>
<form id="listing-form" style="display: flex; flex-direction: column; gap: 1rem;">
<!-- Abschnitt: Titel & Untertitel -->
<fieldset><legend>Allgemein</legend>
<label data-i18n="admin.title.label">Titel (DE)</label>
<input id="title-de" required="" type="text"/>
<label>Untertitel (Preis, Fläche, Zi.) (DE)</label>
<input id="subtitle-de" required="" type="text"/>
<label data-i18n="admin.transaction">Art des Inserats</label>
<select><option data-i18n="form.transaction.buy">Kauf</option><option data-i18n="form.transaction.rent">Miete</option></select>
<label data-i18n="admin.propertyType">Immobilientyp</label>
<select>
<option data-i18n="form.property.flat">Wohnung</option>
<option data-i18n="form.property.house">Haus</option>
<option data-i18n="form.property.lokal">Lokal</option>
<option data-i18n="form.property.building">Gebäude</option>
</select>
</fieldset>
<!-- Abschnitt: Lage -->
<fieldset><legend>Lage</legend>
<label data-i18n="admin.location">Ort / Straße</label>
<input type="text"/>
<label>Etage</label>
<input type="text"/>
</fieldset>
<!-- Abschnitt: Flächen & Zimmer -->
<fieldset><legend>Größe &amp; Zimmer</legend>
<label data-i18n="admin.size">Wohnfläche (m²)</label>
<input type="number"/>
<label data-i18n="admin.price">Preis (€)</label>
<input type="number"/>
<label data-i18n="admin.rooms">Zimmer</label>
<input type="number"/>
</fieldset>
<!-- Abschnitt: Zustand & Baujahr -->
<fieldset><legend>Zustand</legend>
<label>Baujahr</label>
<input type="text"/>
<label>Zustand</label>
<select>
<option>Neu</option>
<option>Gepflegt</option>
<option>Renovierungsbedürftig</option>
<option>Rohbau</option>
</select>
</fieldset>
<!-- Abschnitt: Ausstattung -->
<fieldset><legend>Ausstattung</legend>
<label>Heizungsart</label>
<select>
<option>Zentralheizung</option>
<option>Etagenheizung</option>
<option>Fußbodenheizung</option>
<option>Ofenheizung</option>
</select>
<label>Energieklasse</label>
<select>
<option>A+</option><option>A</option><option>B</option><option>C</option>
<option>D</option><option>E</option><option>F</option><option>G</option>
</select>
<label>Balkon / Terrasse</label>
<select><option>Ja</option><option>Nein</option></select>
<label>Aufzug</label>
<select><option>Ja</option><option>Nein</option></select>
<label>Garage / Stellplatz</label>
<select><option>Garage</option><option>Stellplatz</option><option>Beides</option><option>Nein</option></select>
</fieldset>
<!-- Abschnitt: Medien -->
<fieldset><legend>Medien</legend>
<label><input type="checkbox"/> Wasseranschluss</label>
<label><input type="checkbox"/> Strom</label>
<label><input type="checkbox"/> Gas</label>
<label><input type="checkbox"/> Internet</label>
<label><input type="checkbox"/> Fernwärme</label>
</fieldset>
<!-- Beschreibung -->
<label data-i18n="admin.description">Beschreibung</label>
<textarea id="description" rows="5"></textarea>
<!-- Fotos (Platzhalter) -->
<label data-i18n="admin.image">Fotos hinzufügen</label>
<input multiple="" type="file"/>
<!-- Button -->
<button data-i18n="admin.submit" style="padding: 0.6rem; background: teal; color: white; border: none; border-radius: 6px;" type="submit">Inserat speichern</button>
</form>
<pre id="result" style="margin-top: 2rem; background: #f3f3f3; padding: 1rem; border-radius: 6px;"></pre>
<script>
document.getElementById("listing-form").addEventListener("submit", async function(event) {
  event.preventDefault();
  const titleDe = document.getElementById("title-de").value;
  const subtitleDe = document.getElementById("subtitle-de").value;

  const apiKey = "HIER_DEIN_API_KEY"; // OpenAI-Key hier eintragen
  const headers = {
    "Content-Type": "application/json",
    "Authorization": `Bearer ${apiKey}`
  };

  async function translate(prompt) {
    const body = {
      model: "gpt-4o",
      messages: [{ role: "user", content: prompt }],
      temperature: 0.3
    };

    const response = await fetch("https://api.openai.com/v1/chat/completions", {
      method: "POST",
      headers: headers,
      body: JSON.stringify(body)
    });

    const data = await response.json();
    return data.choices?.[0]?.message?.content || "[Fehler]";
  }

  const promptTitle = `Übersetze diesen deutschen Immobilientitel ins Polnische: "${titleDe}"`;
  const promptSubtitle = `Übersetze diesen Untertitel ins Polnische: "${subtitleDe}"`;

  const titlePl = await translate(promptTitle);
  const subtitlePl = await translate(promptSubtitle);

  const resultObj = {
    title: { de: titleDe, pl: titlePl },
    subtitle: { de: subtitleDe, pl: subtitlePl }
  };

  document.getElementById("result").textContent = JSON.stringify(resultObj, null, 2);
});
</script>
</main>

<nav>

<a data-i18n="nav.agb" href="agb.html">AGB</a>

</nav>
<p data-i18n="auto._2025_residare">© 2025 Residare</p>
</footer>
<div id="overlay"></div>
<script>
  document.addEventListener("click", function (event) {
    const sidebar = document.getElementById("sidebar");
    const hamburger = document.querySelector(".hamburger");
    if (sidebar.classList.contains("open") && !sidebar.contains(event.target) && !hamburger.contains(event.target)) {
      sidebar.classList.remove("open");
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    const selector = document.getElementById("language-selector");
    if (selector && typeof updateLanguage === "function") {
      updateLanguage(selector.value || "de");
    }
  });
</script>
