<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Residare – Template-Seite</title>
<link href="style.css" rel="stylesheet"/>
<script defer="" src="translate.js"></script>
<style>
  #sidebar {
    position: fixed;
    top: 0;
    left: -290px;
    width: 250px;
    height: 100%;
    background: #ffffff;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    padding: 5rem 1rem 1rem;
    transition: left 0.3s ease-in-out;
    z-index: 1000;
  }
  #sidebar.open {
    left: 0;
  }
  #sidebar a {
    display: block;
    margin-bottom: 1rem;
    color: #1f2937;
    text-decoration: none;
    font-weight: 500;
  }
  .hamburger {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 1100;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
  }

  #main-logo {
    width: 100%;
    max-width: 400px;
    height: auto;
  }

  @media (max-width: 768px) {
    #main-logo {
      max-width: 240px;
    }
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 1rem;
  }

  .topbar .logo {
    height: 160px !important;
    width: auto !important;
    margin-left: 1rem;
  }

  .topbar select {
    height: 2.5rem;
    font-size: 1rem;
    margin-left: auto;
  }

  .header-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
  }

  .logo-container {
    position: absolute;
    top: -80px;
    left: 25%;
    transform: translateX(-50%);
    height: 240px;
  }

  .header-logo {
    height: 240px;
    width: auto;
  }

  i.fa-heart {
    color: crimson;
  }

  i.fa-circle-plus {
    color: teal;
  }

  i.fa-user {
    color: darkslateblue;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    display: none;
    z-index: 998;
  }

  .sidebar.open ~ #overlay {
    display: block;
  }
</style>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>
<body style="background-color: white; color: #1f2937;">
<button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div id="sidebar">
<a data-i18n="nav.listings" href="listings.html">Angebote finden</a>
<a data-i18n="nav.favorites" href="favoriten.html">Favoriten</a>
<a data-i18n="nav.post" href="admin.html">Inserieren</a>
<a data-i18n="nav.blog" href="faq.html">Blog</a>
<a data-i18n="nav.contact" href="kontakt.html">Kontakt</a>
</div>
<header class="header">
<div class="header-container" style="gap: 2rem;">
<div class="logo-container">
<a href="index.html"><img alt="Residare Logo" class="header-logo" src="logo.png"/></a>
</div>
<div style="position: absolute; top: 1rem; right: 8rem; display: flex; gap: 1rem; font-size: 0.9rem;">
<a data-i18n="nav.favorites" href="favoriten.html" style="font-family: inherit; color: #000; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; border: 1px solid black; border-radius: 8px; padding: 0.4rem 0.8rem;"><i class="fa-regular fa-heart"></i> Favoriten</a>
<a data-i18n="nav.post" href="admin.html" style="font-family: inherit; color: #000; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; border: 1px solid black; border-radius: 8px; padding: 0.4rem 0.8rem;"><i class="fa-solid fa-circle-plus"></i> Inserieren</a>
<a data-i18n="nav.login" href="login.html" style="font-family: inherit; color: #000; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; border: 1px solid black; border-radius: 8px; padding: 0.4rem 0.8rem;"><i class="fa-regular fa-user"></i> Einloggen</a>
</div>
<select "="" id="language-selector" style="position: absolute; top: 1rem; right: 1rem; z-index: 10; height: 2.5rem; font-size: 1rem; border-radius: 8px; border: 1px solid black;">
<option value="de">🇩🇪</option>
<option value="pl">🇵🇱</option>
</select>
</div>
</header>
<main style="max-width: 800px; margin: 4rem auto; padding: 0 1rem;">
<style>
.selection-container {
  display: flex;
  gap: 2rem;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 2rem;
}
.selection-box {
  background: #f4f4f4;
  padding: 1.5rem;
  border-radius: 12px;
  width: 300px;
  box-shadow: 0 0 6px rgba(0,0,0,0.1);
}
.selection-box h2 {
  font-size: 1.3rem;
  margin-bottom: 1rem;
  text-align: center;
}
.selection-box button {
  width: 100%;
  margin-bottom: 0.5rem;
  padding: 0.7rem;
  font-size: 1rem;
  border: none;
  background: white;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.2s;
  border: 1px solid #ccc;
}
.selection-box button:hover {
  background: #e0e0e0;
}
.price-box {
  background: #f9f9f9;
  padding: 1.5rem;
  border-radius: 12px;
  width: 200px;
  box-shadow: 0 0 6px rgba(0,0,0,0.1);
}
.price-box h3 {
  font-size: 1.4rem;
  margin-bottom: 0.5rem;
}
.price-box ul {
  list-style: disc;
  padding-left: 1.2rem;
}
</style>
<div class="selection-container">
<div class="selection-box">
<h2>🔁 <span data-i18n="admin.sell">Verkaufen</span></h2>
<button data-i18n="type.flat" onclick="location.href='verkauf-wohnung.html'">Wohnung</button>
<button data-i18n="type.house" onclick="location.href='verkauf-haus.html'">Haus</button>
<button data-i18n="type.plot" onclick="location.href='verkauf-grundstueck.html'">Grundstück</button>
<button data-i18n="type.lokal" onclick="location.href='verkauf-lokal.html'">Lokal</button>
<button data-i18n="type.building" onclick="location.href='verkauf-gebaeude.html'">Gewerbegebäude</button>
</div>
<div class="selection-box">
<h2>📍 <span data-i18n="admin.rent">Vermieten</span></h2>
<button data-i18n="type.flat" onclick="location.href='miete-wohnung.html'">Wohnung</button>
<button data-i18n="type.room" onclick="location.href='miete-zimmer.html'">Zimmer</button>
<button data-i18n="type.house" onclick="location.href='miete-haus.html'">Haus</button>
<button data-i18n="type.plot" onclick="location.href='miete-grundstueck.html'">Grundstück</button>
<button data-i18n="type.lokal" onclick="location.href='miete-lokal.html'">Lokal</button>
<button data-i18n="type.building" onclick="location.href='miete-gebaeude.html'">Gewerbegebäude</button>
</div>

</div>
</main>
<footer class="footer">
<nav>
<a data-i18n="nav.contact" href="kontakt.html">Kontakt</a>
<a data-i18n="nav.agb" href="agb.html">AGB</a>
<a data-i18n="nav.privacy" href="datenschutz.html">Datenschutz</a>
<a data-i18n="nav.impress" href="impressum.html">Impressum</a>
</nav>
<p data-i18n="auto._2025_residare">© 2025 Residare</p>
</footer>
<div id="overlay"></div>
<script>
  document.addEventListener("click", function (event) {
    const sidebar = document.getElementById("sidebar");
    const hamburger = document.querySelector(".hamburger");
    if (sidebar.classList.contains("open") && !sidebar.contains(event.target) && !hamburger.contains(event.target)) {
      sidebar.classList.remove("open");
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    const selector = document.getElementById("language-selector");
    if (selector && typeof updateLanguage === "function") {
      updateLanguage(selector.value || "de");
    }
  });
</script>
</body>
</html>
