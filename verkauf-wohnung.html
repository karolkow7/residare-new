<!DOCTYPE html>

<html lang="de">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Residare – Template-Seite</title>
<link href="style.css" rel="stylesheet"/>
<script defer="" src="translate.js"></script>
<style>
  #sidebar {
    position: fixed;
    top: 0;
    left: -290px;
    width: 250px;
    height: 100%;
    background: #ffffff;
    box-shadow: 2px 0 5px rgba(0,0,0,0.1);
    padding: 5rem 1rem 1rem;
    transition: left 0.3s ease-in-out;
    z-index: 1000;
  }
  #sidebar.open {
    left: 0;
  }
  #sidebar a {
    display: block;
    margin-bottom: 1rem;
    color: #1f2937;
    text-decoration: none;
    font-weight: 500;
  }
  .hamburger {
    position: fixed;
    top: 1rem;
    left: 1rem;
    z-index: 1100;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
  }

  #main-logo {
    width: 100%;
    max-width: 400px;
    height: auto;
  }

  @media (max-width: 768px) {
    #main-logo {
      max-width: 240px;
    }
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.5rem 1rem;
  }

  .topbar .logo {
    height: 160px !important;
    width: auto !important;
    margin-left: 1rem;
  }

  .topbar select {
    height: 2.5rem;
    font-size: 1rem;
    margin-left: auto;
  }

  .header-container {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem;
  }

  .logo-container {
    position: absolute;
    top: -80px;
    left: 25%;
    transform: translateX(-50%);
    height: 240px;
  }

  .header-logo {
    height: 240px;
    width: auto;
  }

  i.fa-heart {
    color: crimson;
  }

  i.fa-circle-plus {
    color: teal;
  }

  i.fa-user {
    color: darkslateblue;
  }

  #overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.4);
    display: none;
    z-index: 998;
  }

  .sidebar.open ~ #overlay {
    display: block;
  }
</style>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet"/>
</head>
<body style="background-color: white; color: #1f2937;">
<button class="hamburger" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
<div id="sidebar">
<a data-i18n="nav.listings" href="listings.html">Angebote finden</a>
<a data-i18n="nav.favorites" href="favoriten.html">Favoriten</a>
<a data-i18n="nav.post" href="admin.html">Inserieren</a>
<a data-i18n="nav.blog" href="faq.html">Blog</a>
<a data-i18n="nav.contact" href="kontakt.html">Kontakt</a>
</div>
<header class="header">
<div class="header-container" style="gap: 2rem;">
<div class="logo-container">
<a href="index.html"><img alt="Residare Logo" class="header-logo" src="logo.png"/></a>
</div>
<div style="position: absolute; top: 1rem; right: 8rem; display: flex; gap: 1rem; font-size: 0.9rem;">
<a data-i18n="nav.favorites" href="favoriten.html" style="font-family: inherit; color: #000; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; border: 1px solid black; border-radius: 8px; padding: 0.4rem 0.8rem;"><i class="fa-regular fa-heart"></i> Favoriten</a>
<a data-i18n="nav.post" href="admin.html" style="font-family: inherit; color: #000; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; border: 1px solid black; border-radius: 8px; padding: 0.4rem 0.8rem;"><i class="fa-solid fa-circle-plus"></i> Inserieren</a>
<a data-i18n="nav.login" href="login.html" style="font-family: inherit; color: #000; text-decoration: none; display: flex; align-items: center; gap: 0.3rem; border: 1px solid black; border-radius: 8px; padding: 0.4rem 0.8rem;"><i class="fa-regular fa-user"></i> Einloggen</a>
</div>
<select "="" id="language-selector" style="position: absolute; top: 1rem; right: 1rem; z-index: 10; height: 2.5rem; font-size: 1rem; border-radius: 8px; border: 1px solid black;">
<option value="de">🇩🇪</option>
<option value="pl">🇵🇱</option>
</select>
</div>
</header>
<main style="max-width: 800px; margin: 4rem auto; padding: 0 1rem;">
<style>
  .form-section { background: #fff; padding: 2rem; margin-bottom: 2rem; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
  .form-section h2 { font-size: 1.4rem; margin-bottom: 1rem; border-bottom: 1px solid #ddd; padding-bottom: 0.5rem; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
  .form-group { display: flex; flex-direction: column; }
  .form-group label { font-weight: 600; margin-bottom: 0.4rem; }
  .form-group input, .form-group select, .form-group textarea { padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
</style>
<form id="full-flat-sale-form">
<div class="form-section">
<h2>Grunddaten</h2>
<div class="form-grid">
<div class="form-group"><label>Titel</label><input type="text"/></div>
<div class="form-group"><label>Untertitel</label><input type="text"/></div>
<div class="form-group"><label>Wohnfläche (m²)</label><input type="number"/></div>
<div class="form-group"><label>Nutzfläche (m²)</label><input type="number"/></div>
<div class="form-group"><label>Preis (€)</label><input type="number"/></div>
<div class="form-group"><label>Preis pro m² (€)</label><input type="number"/></div>
<div class="form-group"><label>Hausgeld (€)</label><input type="number"/></div>
<div class="form-group"><label>Zimmer</label><input type="number"/></div>
<div class="form-group"><label>Anzahl Bäder</label><input type="number"/></div>
<div class="form-group"><label>Separates WC</label><select><option>Ja</option><option>Nein</option></select></div>
</div>
</div>
<div class="form-section">
<h2>Gebäude &amp; Zustand</h2>
<div class="form-grid">
<div class="form-group"><label>Etage</label><input type="text"/></div>
<div class="form-group"><label>Etagen gesamt</label><input type="number"/></div>
<div class="form-group"><label>Aufzug</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Baujahr</label><input type="text"/></div>
<div class="form-group"><label>Zustand</label><select><option>Sehr gut</option><option>Renoviert</option><option>Renovierungsbedürftig</option></select></div>
<div class="form-group"><label>Gebäudetyp</label><select><option>Block</option><option>Altbau</option><option>Neubau</option></select></div>
<div class="form-group"><label>Dachgeschoss</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Etagenanzahl in Wohnung</label><select><option>1</option><option>2</option><option>3+</option></select></div>
</div>
</div>
<div class="form-section">
<h2>Ausstattung</h2>
<div class="form-grid">
<div class="form-group"><label>Balkon</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Keller</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Garten</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Stellplatz</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Einbauküche</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Möbliert</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Haushaltsgeräte</label><select><option>Voll</option><option>Teil</option><option>Keine</option></select></div>
</div>
</div>
<div class="form-section">
<h2>Energie &amp; Medien</h2>
<div class="form-grid">
<div class="form-group"><label>Energieausweis</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Energieklasse</label><select><option>A+</option><option>A</option><option>B</option><option>C</option></select></div>
<div class="form-group"><label>Heizungsart</label><select><option>Zentral</option><option>Etagenheizung</option><option>Fußboden</option></select></div>
<div class="form-group"><label>Strom</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Gas</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Wasserzähler</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Fernwärme</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Klimaanlage</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label>Internet</label><select><option>Ja</option><option>Nein</option></select></div>
</div>
</div>
<div class="form-section">
<h2>Weitere Angaben</h2>
<div class="form-grid">
<div class="form-group"><label>Verfügbarkeit</label><select><option>Sofort</option><option>Nach Vereinbarung</option></select></div>
<div class="form-group"><label>Eigentumsform</label><select><option>Eigentum</option><option>Genossenschaft</option></select></div>
<div class="form-group"><label>Grundbuch vorhanden</label><select><option>Ja</option><option>Nein</option></select></div>
<div class="form-group"><label><input type="checkbox"/> Tausch möglich</label></div>
<div class="form-group"><label><input type="checkbox"/> Auch als Büro nutzbar</label></div>
</div>
</div>
<div class="form-section">
<h2>Beschreibung &amp; Fotos</h2>
<div class="form-grid">
<div class="form-group" style="grid-column: span 2;"><label>Ort</label><input type="text"/></div>
<div class="form-group" style="grid-column: span 2;"><label>Beschreibung</label><textarea rows="4"></textarea></div>
<div class="form-group" style="grid-column: span 2;"><label>Fotos</label><input accept="image/*" multiple="" type="file"/></div>
</div>
</div>
<div style="display: flex; gap: 1rem;">
<button class="primary-btn" type="submit">Inserat speichern</button>
<button class="secondary-btn" type="button">Später abschließen</button>
</div>
</form>
</main>
<footer class="footer">
<nav>
<a data-i18n="nav.contact" href="kontakt.html">Kontakt</a>
<a data-i18n="nav.agb" href="agb.html">AGB</a>
<a data-i18n="nav.privacy" href="datenschutz.html">Datenschutz</a>
<a data-i18n="nav.impress" href="impressum.html">Impressum</a>
</nav>
<p data-i18n="auto._2025_residare">© 2025 Residare</p>
</footer>
<div id="overlay"></div>
<script>
  document.addEventListener("click", function (event) {
    const sidebar = document.getElementById("sidebar");
    const hamburger = document.querySelector(".hamburger");
    if (sidebar.classList.contains("open") && !sidebar.contains(event.target) && !hamburger.contains(event.target)) {
      sidebar.classList.remove("open");
    }
  });

  document.addEventListener("DOMContentLoaded", function () {
    const selector = document.getElementById("language-selector");
    if (selector && typeof updateLanguage === "function") {
      updateLanguage(selector.value || "de");
    }
  });
</script>
</body>
</html>
