<style>
.toggle-btn {
  background-color: #eee;
  border: 1px solid #ccc;
  padding: 0.4rem 1rem;
  border-radius: 6px;
  cursor: pointer;
  font-weight: bold;
}
.toggle-btn.active {
  background-color: #1f2937;
  color: white;
}

.toggle-group {
  display: inline-flex;
  padding: 0;
  margin: 0;
}
.toggle-group .toggle-btn {
  margin-left: -1px;
}
.toggle-group .toggle-btn:first-child {
  margin-left: 0;
}
</style>
<script>
document.querySelectorAll('.toggle-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const siblings = btn.parentElement.querySelectorAll('.toggle-btn');
    siblings.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  });
});
</script>
<script src="form-save.js"></script>
<script>
document.querySelectorAll('.toggle-group').forEach(group => {
  const hidden = group.nextElementSibling;
  group.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      group.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      if (hidden) hidden.value = btn.textContent.toLowerCase();
    });
  });
});
</script>
