<!DOCTYPE html>

<html lang="de"><head><meta charset="utf-8"/><title>Listings</title><style>
body {
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}
button, select, input {
  font-family: inherit;
}
.card:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  transition: all 0.2s ease-in-out;
}
.card img {
  aspect-ratio: 1/1;
  object-fit: cover;
}
.card {
  border-radius: 12px;
  overflow: hidden;
  background: white;
  box-shadow: 0 1px 4px rgba(0,0,0,0.05);
}
.search-bar input,
.search-bar select,
.search-bar button {
  border-radius: 8px;
}
</style></head><body>
<header style="display: flex; justify-content: space-between; align-items: center; padding: 0.8rem 1rem; background: white; border-bottom: 1px solid #ddd;">
<div style="display: flex; align-items: center; gap: 1rem;"><button id="hamburger" style="font-size: 1.5rem; background: none; border: none;">☰</button><img alt="Residare Logo" src="logo.png" style="height: 55px;"/></div>
<select id="language-selector" style="font-size: 1.2rem; border: none; background: transparent;">
<option value="de">🇩🇪</option>
<option value="pl">🇵🇱</option>
</select>
</header>
<nav id="sidebar" style="position: fixed; top: 0; left: -290px; width: 250px; height: 100%; background: #f4f4f4; box-shadow: 2px 0 5px rgba(0,0,0,0.1); padding: 5rem 1rem 1rem; transition: left 0.3s ease-in-out; z-index: 1000;">
<ul style="list-style: none; padding: 0; font-size: 1.1rem;">
<li><a data-i18n="menu.listings" href="listings.html" style="display: block; font-size: 1rem; color: #111; text-decoration: none; margin-bottom: 1rem;">Angebote</a></li>
<li><a data-i18n="menu.favorites" href="favoriten.html" style="display: block; font-size: 1rem; color: #111; text-decoration: none; margin-bottom: 1rem;">Favoriten</a></li>
<li><a data-i18n="menu.submit" href="admin.html" style="display: block; font-size: 1rem; color: #111; text-decoration: none; margin-bottom: 1rem;">Inserieren</a></li>
<li><a data-i18n="menu.blog" href="blog.html" style="display: block; font-size: 1rem; color: #111; text-decoration: none; margin-bottom: 1rem;">Blog</a></li>
<li><a data-i18n="menu.contact" href="kontakt.html" style="display: block; font-size: 1rem; color: #111; text-decoration: none; margin-bottom: 1rem;">Kontakt</a></li>
</ul>
</nav>
<div id="overlay" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.3); display: none; z-index: 999;"></div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    hamburger.onclick = () => { sidebar.style.left = '0'; overlay.style.display = 'block'; };
    overlay.onclick = () => { sidebar.style.left = '-250px'; overlay.style.display = 'none'; };
  });
</script>
<section class="search-bar" style="padding: 1rem; background: #f4f4f4; display: flex; flex-wrap: wrap; gap: 1rem;">
<input data-i18n-placeholder="search.location" placeholder="📍 Kassel" style="flex: 1; min-width: 180px; padding: 0.5rem;" type="text"/>
<select data-i18n-placeholder="search.price" style="padding: 0.5rem; min-width: 120px;"><option>Kaufpreis</option></select>
<select data-i18n-placeholder="search.area" style="padding: 0.5rem; min-width: 120px;"><option>Wohnfläche</option></select>
<select data-i18n-placeholder="search.rooms" style="padding: 0.5rem; min-width: 120px;"><option>Zimmer</option></select>
<button data-i18n="search.save" style="padding: 0.5rem 1rem; background: #00bfa6; color: white; border: none; border-radius: 4px;">Suche speichern</button>
</section>
<main style="display: flex; flex-direction: row; gap: 1rem; padding: 1rem;">
<div id="results" style="flex: 1.2; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem;">
<div class="card" style="border: 1px solid #ccc; border-radius: 10px; overflow: hidden; background: #fff;">
<img alt="Wohnung 1" src="wohnung1.jpg" style="width: 100%; height: 180px; object-fit: cover;"/>
<div style="padding: 0.8rem;">
<h3 data-i18n="listing.title1" style="margin: 0;">Moderne Wohnung in Kassel</h3>
<p data-i18n="listing.details1" style="margin: 0.2rem 0;">330.000 € – 105 m² – 3 Zi.</p>
<p style="margin: 0; font-size: 0.9em; color: #555;">Süd, Kassel</p>
</div>
</div>
<div class="card" style="border: 1px solid #ccc; border-radius: 10px; overflow: hidden; background: #fff;">
<img alt="Wohnung 2" src="wohnung2.jpg" style="width: 100%; height: 180px; object-fit: cover;"/>
<div style="padding: 0.8rem;">
<h3 data-i18n="listing.title2" style="margin: 0;">Helle Wohnung mit Balkon</h3>
<p data-i18n="listing.details2" style="margin: 0.2rem 0;">298.000 € – 101 m² – 4 Zi.</p>
<p style="margin: 0; font-size: 0.9em; color: #555;">Brasselsberg, Kassel</p>
</div>
</div>
</div>
<div id="map" style="flex: 1; min-width: 400px; height: 600px; border: 1px solid #ccc; border-radius: 8px;; background: #ddd; display: flex; align-items: center; justify-content: center; color: #333; font-weight: bold;">Karte folgt hier...</div>
</main>
<footer class="footer" style="padding: 2rem 1rem; background: #1f2937; color: white; text-align: center; font-size: 0.95rem;">
<nav style="margin-bottom: 0.5rem;">
<a data-i18n="nav.contact" href="kontakt.html" style="color: white; margin-right: 1rem;">Kontakt</a>
<a data-i18n="nav.agb" href="agb.html" style="color: white; margin-right: 1rem;">AGB</a>
<a data-i18n="nav.privacy" href="datenschutz.html" style="color: white; margin-right: 1rem;">Datenschutz</a>
<a data-i18n="nav.impress" href="impressum.html" style="color: white;">Impressum</a>
</nav>
<p data-i18n="auto._2025_residare">© 2025 Residare</p>
</footer>
</body></html>
